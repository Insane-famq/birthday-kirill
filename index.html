* {

body {
  background: #000;
  color: #fff;
  overflow-x: hidden;
  min-height: 100vh;
}

.hidden {
  display: none !important;
}

/* ЭКРАН 1 */
#screen-start {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 999;
  padding: 20px;
}

#start-btn {
  background: #000;
  color: #fff;
  border: none;
  padding: 40px 50px;
  font-size: 24px;
  font-weight: bold;
  border-radius: 20px;
  cursor: pointer;
  text-align: center;
  max-width: 90%;
  line-height: 1.3;
  transition: transform 0.2s;
}

#start-btn:active {
  transform: scale(0.95);
}

/* ЭКРАН 2 */
#screen-login {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 998;
  padding: 20px;
}

.login-box {
  background: #fff;
  padding: 20px;
  width: 100%;
  max-width: 400px;
  text-align: center;
}

  width: 100%;
  padding: 15px;
  margin-bottom: 8px;
  background: #f0f0f0;
  border: 2px solid #000;
  border-radius: 10px;
  color: #000;
  font-size: 16px;
}

.login-box input:focus {
  outline: none;
  border-color: #00e676;
}

.hint {
  font-size: 12px;
  color: #666;
  margin-bottom: 15px;

#login-btn {
  width: 100%;

  border: none;
  border-radius: 10px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
}

#login-btn:active {
  transform: scale(0.97);
}

#login-error {
  color: #ff0000;
  margin-top: 15px;
  font-size: 14px;
  font-weight: bold;
}

/* ЭКРАН 3 */
#screen-main {
  padding: 20px;
  max-width: 800px;
  margin: 0 auto;
  animation: fadeIn 1s ease-in;
  padding-bottom: 60px;
}

@keyframes fadeIn {
  from { opacity: 0; }

}

.main-title {

  color: #00e676;
  font-size: 28px;

#click-counter {

}

#gallery {

  margin-bottom: 25px;
}

  height: 180px;

}

#gallery img:active {

}

  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.95);

function loadContent() {
  PHOTOS.forEach(src => {
    const img = document.createElement('img');
    img.src = src;
    img.loading = 'lazy';
    img.addEventListener('click', () => openPhoto(src));
    gallery.appendChild(img);
  });

  VIDEOS.forEach(src => {
    const video = document.createElement('video');
    video.src = src;
    video.controls = true;
    video.preload = 'none';
    video.addEventListener('play', () => bgMusic.pause());
    video.addEventListener('pause', () => bgMusic.play());
    video.addEventListener('ended', () => bgMusic.play());
    videos.appendChild(video);
  });

  let clicks = 0;
  document.body.addEventListener('click', () => {
    clicks++;
    clickCounter.textContent = `Ты нажал ${clicks} раз, дрыщ`;
  });
}

function openPhoto(src) {
  const modal = document.createElement('div');
  modal.className = 'photo-modal';
  const img = document.createElement('img');
  img.src = src;
  modal.appendChild(img);
  modal.addEventListener('click', () => modal.remove());
  document.body.appendChild(modal);
}
