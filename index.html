}
.title-grey { color: #888; }
.title-green { color: #00e676; text-shadow: 0 0 20px #00e676; }
.title-purple { color: #b14aff; text-shadow: 0 0 20px #b14aff; }
.title-red { color: #ff2b2b; text-shadow: 0 0 20px #ff2b2b; }
.title-gold { color: #ffd700; text-shadow: 0 0 25px #ffd700; }

.title-rainbow, .counter-rainbow {
  background: linear-gradient(90deg, #ff0000, #ff8000, #ffff00, #00ff00, #00ffff, #0080ff, #8000ff, #ff00ff, #ff0000);
  background-size: 300% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: rainbowMove 3s linear infinite;
}
@keyframes rainbowMove {
  0% { background-position: 0% 50%; }
  100% { background-position: 300% 50%; }
}

#click-counter, #click-counter-2 {

    bgMusic.play().catch(e => console.log('Музыка:', e));
    showPhoto(0);
    showVideo(0);
    startClickCounter();
  } else {
    loginError.textContent = 'не правильно, попробуй ещё раз дрыщятина ванючая';
  }
});

let currentPhoto = 0;

function showPhoto(index) {
  galleryImg.src = PHOTOS[index];
  photoCounter.textContent = `${index + 1} / ${PHOTOS.length}`;
  prevBtn.disabled = index === 0;
  nextPhotoBtn.disabled = index === PHOTOS.length - 1;
  if (index === PHOTOS.length - 1) nextBtn.classList.remove('hidden');
  else nextBtn.classList.add('hidden');
}

prevBtn.addEventListener('click', () => {
  if (currentPhoto > 0) { currentPhoto--; showPhoto(currentPhoto); }
});
nextPhotoBtn.addEventListener('click', () => {
  if (currentPhoto < PHOTOS.length - 1) { currentPhoto++; showPhoto(currentPhoto); }
});

let currentVideo = 0;

function showVideo(index) {
  videoPlayer.src = VIDEOS[index];
  videoCounter.textContent = `${index + 1} / ${VIDEOS.length}`;
  prevVideoBtn.disabled = index === 0;
  nextVideoBtn.disabled = index === VIDEOS.length - 1;
  if (index === VIDEOS.length - 1) killBtn.classList.remove('hidden');
  else killBtn.classList.add('hidden');
}

prevVideoBtn.addEventListener('click', () => {
  if (currentVideo > 0) { currentVideo--; showVideo(currentVideo); }
});
nextVideoBtn.addEventListener('click', () => {
  if (currentVideo < VIDEOS.length - 1) { currentVideo++; showVideo(currentVideo); }
});

videoPlayer.addEventListener('play', () => bgMusic.pause());
videoPlayer.addEventListener('pause', () => bgMusic.play());
videoPlayer.addEventListener('ended', () => bgMusic.play());

let nextBtnAttempts = 0;

function moveNextBtn() {
  const btnWidth = nextBtn.offsetWidth || 200;
  const btnHeight = nextBtn.offsetHeight || 60;
  const maxX = window.innerWidth - btnWidth - 20;
  const maxY = window.innerHeight - btnHeight - 20;
  const x = Math.random() * maxX;
  const y = Math.random() * maxY;
  nextBtn.style.left = x + 'px';
  nextBtn.style.top = y + 'px';
  nextBtn.style.transform = 'none';
}

nextBtn.addEventListener('mouseenter', () => {
  if (nextBtnAttempts < 3) moveNextBtn();
});

nextBtn.addEventListener('click', (e) => {
  if (nextBtnAttempts < 3) {
    e.preventDefault();
    nextBtnAttempts++;
    nextBtn.classList.add('runaway');
    moveNextBtn();
  } else {
    screenPage1.classList.add('hidden');
    screenPage2.classList.remove('hidden');
    window.scrollTo(0, 0);
  }
});

backBtn2.addEventListener('click', () => {
  screenPage2.classList.add('hidden');
  screenPage1.classList.remove('hidden');
  window.scrollTo(0, 0);
});

backBtn3.addEventListener('click', () => {
  screenFinal.classList.add('hidden');
  screenPage2.classList.remove('hidden');
  sadMusic.pause();
  bgMusic.play();
  window.scrollTo(0, 0);
});

let clicks = 0;
let rainbowMode = false;

function updateColors() {
  mainTitle.className = mainTitle2.className = 'main-title title-grey';
  clickCounter.className = clickCounter2.className = 'counter-grey';
  setButtonsClass('btn-grey');

  if (clicks >= 11 && clicks <= 25) {
    mainTitle.className = mainTitle2.className = 'main-title title-green';
    clickCounter.className = clickCounter2.className = 'counter-green';
    setButtonsClass('btn-green');
  } else if (clicks >= 26 && clicks <= 40) {
    mainTitle.className = mainTitle2.className = 'main-title title-purple';
    clickCounter.className = clickCounter2.className = 'counter-purple';
    setButtonsClass('btn-purple');
  } else if (clicks >= 41 && clicks <= 55) {
    mainTitle.className = mainTitle2.className = 'main-title title-red';
    clickCounter.className = clickCounter2.className = 'counter-red';
    setButtonsClass('btn-red');
  } else if (clicks >= 56 && clicks <= 66) {
    mainTitle.className = mainTitle2.className = 'main-title title-gold';
    clickCounter.className = clickCounter2.className = 'counter-gold';
    setButtonsClass('btn-gold');
  }
}

function setButtonsClass(cls) {
  const allBtns = [prevBtn, nextPhotoBtn, nextBtn, prevVideoBtn, nextVideoBtn, killBtn, meme67Close];
  allBtns.forEach(b => {
    b.classList.remove('btn-grey', 'btn-green', 'btn-purple', 'btn-red', 'btn-gold', 'btn-rainbow');
    b.classList.add(cls);
  });
}

function startClickCounter() {
  document.body.addEventListener('click', () => {
    clicks++;
    clickCounter.textContent = `Ты нажал ${clicks} раз, дрыщ`;
    clickCounter2.textContent = `Ты нажал ${clicks} раз, дрыщ`;

    if (clicks === 67 && !rainbowMode) {
      meme67Img.src = MEME_67_URL;
      meme67.classList.remove('hidden');
      rainbowMode = true;
      mainTitle.className = mainTitle2.className = 'main-title title-rainbow';
      clickCounter.className = clickCounter2.className = 'counter-rainbow';
      setButtonsClass('btn-rainbow');
    } else if (!rainbowMode) {
      updateColors();
    }
  });
}

meme67Close.addEventListener('click', () => {
  meme67.classList.add('hidden');
});

let killCount = 0;

killBtn.addEventListener('click', () => {
  killCount++;

  if (killCount === 1) {
    killBtn.textContent = 'хахаха ебать ты дрыщ нажми снова';
  } else if (killCount === 2) {
    killBtn.textContent = 'пиздец нахуй таким дрыщом стал а ну ка убеи меня так чтоб я ахуел блять';
  } else if (killCount === 3) {
    screenPage2.classList.add('hidden');
    screenFinal.classList.remove('hidden');
    finalText.textContent = FINAL_MESSAGE;
    bgMusic.pause();
    sadMusic.volume = 0.3;
    sadMusic.play().catch(e => console.log('Грустная музыка:', e));
    window.scrollTo(0, 0);
  }
});
</script>
